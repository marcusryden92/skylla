<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- skylla: an allen-wrench S with one tail and three parallel heads -->
  <circle cx="128" cy="128" r="124" fill="#161b22"/>
  <g stroke="#ffffff" stroke-width="15" fill="none" stroke-linecap="round">
    <!-- tail + vertical pipe -->
    <path d="M 58 198 H 86 A 18 18 0 0 0 104 180 V 78"/>
    <!-- three heads: top, between, halfway down the pipe -->
    <path d="M 104 78  A 18 18 0 0 1 122 60  H 198"/>
    <path d="M 104 124 A 18 18 0 0 1 122 106 H 198"/>
    <path d="M 104 170 A 18 18 0 0 1 122 152 H 198"/>
  </g>
</svg>
